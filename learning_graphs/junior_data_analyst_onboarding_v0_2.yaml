schema_version: '0.1'
graph_id: junior_data_analyst_onboarding
graph_version: '0.2'
primary_entry_domain: contact_center_fundamentals
domains:
- id: contact_center_fundamentals
  name: Contact Center Fundamentals
  description: Foundational operational concepts used to understand how a contact center organizes customer
    interactions, routing, agents, queues, flows, and service objectives.
  learning_objective: The learner should be able to explain the main operational components of a contact
    center, relate them to one another, and reconstruct a plausible end-to-end customer-interaction scenario.
- id: contact_center_metrics
  name: Contact Center Metrics
  description: Core operational and customer-experience metrics used to interpret contact-center performance
    and connect individual indicators to broader operational scenarios.
  learning_objective: The learner should be able to explain the main contact-center metrics, relate them
    to operational events, and interpret combinations of metrics in plausible analytical scenarios.
- id: genesys_cloud
  name: Genesys Cloud
  description: Public reference concepts for understanding Genesys Cloud as a customer-experience platform,
    including navigation, routing, integration, analytics, workforce, and AI-assisted capabilities.
  learning_objective: The learner should be able to explain the main public Genesys Cloud capability areas
    and relate platform components to routing, operations, analytics, integrations, and customer-experience
    workflows.
- id: genesys_data_access
  name: Genesys / Data Access
  description: Public reference concepts for locating and consuming Genesys Cloud data through documented
    data-access surfaces, with emphasis on analytical use rather than employer-specific implementations.
  learning_objective: The learner should be able to distinguish common public Genesys Cloud data-access
    surfaces, identify the kind of information they expose, and choose plausible sources for analytical
    questions.
- id: programming
  name: Programming
  description: Programming foundations used by a junior data analyst to read, understand, and perform
    small data-oriented changes in Python, Pandas, NumPy, and SQL.
  learning_objective: The learner should be able to read and explain simple data-oriented code, identify
    common Python and SQL structures, and perform small supervised transformations without losing sight
    of the business question.
- id: statistics
  name: Statistics
  description: Introductory statistical concepts used to summarize data, reason about variation and relationships,
    and interpret analytical results.
  learning_objective: The learner should be able to explain and interpret introductory statistical measures
    and use them appropriately when reasoning about operational data.
- id: data_visualization
  name: Data Visualization
  description: Foundations for reading, selecting, and communicating data visualizations clearly in analytical
    work.
  learning_objective: The learner should be able to interpret common charts, choose simple visual encodings
    for analytical questions, and communicate findings in a clear visual narrative.
